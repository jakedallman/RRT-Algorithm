<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RRT* Algorithm</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="controls">
        <input id="setupMessage" type="text" value="Click the top-left and bottom-right corners of an obstacle." readonly>
        <button id="confirmButton" type="button">Confirm obstacles</button>
        <label id="runControls" hidden>
            Runs
            <input id="runCount" type="number" min="1" max="30000" value="20000">
            <button id="runButton" type="button">Run</button>
        </label>
    </div>
    <div id="totalCost">Total cost: ____</div>
    <canvas id="myCanvas" width="800" height="400"></canvas>
</body>
    <script type="module" src="main.js"></script>
</html>
